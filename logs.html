<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Logs — ElectroStock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="logs.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-mark">⚡</span>
                <div class="logo-text">
                    <span class="logo-main">ElectroStock</span>
                    <span class="logo-sub">EE Lab Inventory System</span>
                </div>
            </div>
            <div class="nav-links">
                <a href="index.html">Dashboard</a>
                <a href="request.html">Request Items</a>
                <a href="logs.html" class="active">Lab Logs</a>
            </div>
            <div class="nav-status" id="navStatus">
                <span class="status-dot"></span>
                <span class="status-label">Connecting…</span>
            </div>
        </div>
    </nav>

    <main class="container">

        <!-- Page header -->
        <header class="logs-header">
            <div class="logs-header-top">
                <div>
                    <h1>Lab Logs</h1>
                    <p class="header-sub">All item requests from the Requests sheet — newest first</p>
                </div>
                <button class="refresh-btn" id="refreshBtn" title="Refresh logs">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                         fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                        <path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
                    </svg>
                    Refresh
                </button>
            </div>

            <!-- Summary chips -->
            <div class="logs-chips" id="logsChips">
                <div class="chip chip--total"><span class="chip-num" id="chipTotal">—</span><span class="chip-label">Total</span></div>
                <div class="chip chip--warn"><span class="chip-num" id="chipBorrow">—</span><span class="chip-label">Borrow</span></div>
                <div class="chip chip--ok"><span class="chip-num" id="chipBuy">—</span><span class="chip-label">Buy</span></div>
                <div class="chip chip--total"><span class="chip-num" id="chipNew">—</span><span class="chip-label">Req. New</span></div>
            </div>

            <!-- Dual filters -->
            <div class="filter-bar" id="filterBar">
                <div class="filter-group">
                    <label for="filterType">Type</label>
                    <select id="filterType" class="filter-select">
                        <option value="All">All Types</option>
                        <option value="Borrow">Borrow</option>
                        <option value="Buy">Buy</option>
                        <option value="Request New">Request New</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus" class="filter-select">
                        <option value="All">All Statuses</option>
                        <option value="Reserved">Reserved</option>
                        <option value="Not Returned">Not Returned</option>
                        <option value="Returned">Returned</option>
                        <option value="Pending">Pending</option>
                        <option value="Purchased">Purchased</option>
                        <option value="Acknowledged">Acknowledged</option>
                    </select>
                </div>
                <span class="filter-result" id="filterResult"></span>
            </div>
        </header>

        <!-- Logs table -->
        <section class="logs-table-wrap" id="logsTableWrap">

            <table class="logs-table" id="logsTable">
                <thead id="logsTableHead" class="hidden">
                    <tr>
                        <th>Name</th>
                        <th>Course / Year / Section</th>
                        <th>Type</th>
                        <th>Materials</th>
                        <th>Reason</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <!-- Skeleton rows shown while loading -->
                <tbody id="logsSkeleton">
                    <tr class="skel-row-tr"><td colspan="7"><div class="skel skel-cell w40"></div></td></tr>
                    <tr class="skel-row-tr"><td colspan="7"><div class="skel skel-cell w40"></div></td></tr>
                    <tr class="skel-row-tr"><td colspan="7"><div class="skel skel-cell w40"></div></td></tr>
                    <tr class="skel-row-tr"><td colspan="7"><div class="skel skel-cell w40"></div></td></tr>
                    <tr class="skel-row-tr"><td colspan="7"><div class="skel skel-cell w40"></div></td></tr>
                </tbody>
                <tbody id="logsTableBody"></tbody>
            </table>

            <!-- Empty / error state -->
            <div class="state-message hidden" id="logsEmpty">
                <span class="state-icon">📋</span>
                <h3 id="logsEmptyTitle">No logs yet</h3>
                <p id="logsEmptyMsg">Submitted requests will appear here.</p>
            </div>
        </section>

    </main>

    <script src="logs.js"></script>
</body>
</html>
